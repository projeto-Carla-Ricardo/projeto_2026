<!DOCTYPE html>
<html lang="pt"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — AILO</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head><body>
    <nav class="navbar"><a href="/" class="navbar-brand"><div class="logo-hex"></div><span>AILO</span></a><div class="navbar-nav" id="nav-links"></div></nav>
    <div class="auth-container">
        <div class="auth-card animate-fade">
            <h1>Bem-vindo de volta</h1>
            <p class="subtitle">Entre na sua conta AILO</p>
            <form id="login-form">
                <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="email" required placeholder="seu@email.pt"></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="password" required placeholder="••••••"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="login-btn">Entrar</button>
            </form>
            <div class="auth-footer">Não tem conta? <a href="/pages/register.html">Registar</a></div>
        </div>
    </div>
    <script src="/static/js/api.js"></script><script src="/static/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.textContent = 'A entrar...'; btn.disabled = true;
            try {
                const res = await api.login({ email: document.getElementById('email').value, password: document.getElementById('password').value });
                api.setToken(res.token); api.setUser(res.user);
                showToast('Login efetuado com sucesso!', 'success');
                setTimeout(() => window.location.href = '/pages/dashboard.html', 500);
            } catch (err) { showToast(err.error || 'Erro no login', 'error'); btn.textContent = 'Entrar'; btn.disabled = false; }
        });
    </script>
</body></html>
