<!DOCTYPE html>
<html lang="pt"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizações — AILO</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head><body>
    <nav class="navbar"><a href="/" class="navbar-brand"><div class="logo-hex"></div><span>AILO</span></a><div class="navbar-nav" id="nav-links"></div></nav>
    <div class="main-content">
        <div class="flex justify-between items-center mb-lg">
            <h1>Organizações</h1>
            <button class="btn btn-primary" onclick="showModal()">+ Nova Organização</button>
        </div>
        <div id="org-grid" class="grid grid-2"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">Nova Organização</h2>
            <form id="org-form">
                <div class="form-group"><label class="form-label">Nome</label><input type="text" class="form-input" id="org-nome" required></div>
                <div class="grid grid-2">
                    <div class="form-group"><label class="form-label">Setor</label>
                        <select class="form-select" id="org-setor" required>
                            <option value="">Selecionar...</option><option>Educação</option><option>Tecnologia</option><option>Saúde</option><option>Retalho</option><option>Indústria</option><option>Serviços</option><option>Administração Pública</option><option>Outro</option>
                        </select></div>
                    <div class="form-group"><label class="form-label">Dimensão</label>
                        <select class="form-select" id="org-dimensao" required>
                            <option value="">Selecionar...</option><option value="micro">Micro (1-9)</option><option value="pequena">Pequena (10-49)</option><option value="media">Média (50-249)</option><option value="grande">Grande (250+)</option>
                        </select></div>
                </div>
                <div class="grid grid-2">
                    <div class="form-group"><label class="form-label">Tipo</label>
                        <select class="form-select" id="org-tipo" required>
                            <option value="">Selecionar...</option><option value="mpe">Microempresa</option><option value="pme">PME</option><option value="grande_empresa">Grande Empresa</option><option value="ensino_superior">Ensino Superior</option>
                        </select></div>
                    <div class="form-group"><label class="form-label">País</label><input type="text" class="form-input" id="org-pais" value="Portugal"></div>
                </div>
                <div class="form-group"><label class="form-label">Descrição</label><textarea class="form-textarea" id="org-desc" rows="3" placeholder="Breve descrição da organização..."></textarea></div>
                <div class="flex gap-sm" style="justify-content:flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="hideModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/static/js/api.js"></script><script src="/static/js/app.js"></script>
    <script>
        if (!requireAuth()) throw 'not auth';
        let editId = null;

        async function loadOrgs() {
            try {
                const res = await api.getOrganizacoes();
                const grid = document.getElementById('org-grid');
                if (res.data.length === 0) {
                    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🏢</div><h3>Sem organizações</h3><p>Crie a primeira organização para começar a avaliar.</p></div>';
                } else {
                    grid.innerHTML = res.data.map(o => `
                        <div class="card">
                            <div class="flex justify-between items-center mb-sm">
                                <h3>${o.nome}</h3>
                                <div class="flex gap-sm">
                                    <button class="btn btn-sm btn-secondary" onclick="editOrg(${o.id},'${o.nome}','${o.setor}','${o.dimensao}','${o.tipo}','${o.pais||''}','${(o.descricao||'').replace(/'/g,"\\'")}')">✏️</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteOrg(${o.id})">🗑️</button>
                                </div>
                            </div>
                            <p style="color:var(--text-secondary);font-size:14px;">${o.setor} · ${o.tipo} · ${o.dimensao}</p>
                            ${o.descricao ? `<p style="font-size:13px;color:var(--text-muted);margin-top:8px;">${o.descricao}</p>` : ''}
                            <div style="margin-top:16px;display:flex;gap:8px;">
                                <button class="btn btn-sm btn-primary" onclick="startAval(${o.id})">🚀 Iniciar Avaliação</button>
                                <span style="font-size:13px;color:var(--text-muted);align-self:center;">${o.avaliacoes_count} avaliações</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch(e) { console.error(e); }
        }

        function showModal() { editId = null; document.getElementById('modal-title').textContent = 'Nova Organização'; document.getElementById('org-form').reset(); document.getElementById('modal').classList.add('active'); }
        function hideModal() { document.getElementById('modal').classList.remove('active'); }
        function editOrg(id, nome, setor, dim, tipo, pais, desc) {
            editId = id; document.getElementById('modal-title').textContent = 'Editar Organização';
            document.getElementById('org-nome').value = nome; document.getElementById('org-setor').value = setor;
            document.getElementById('org-dimensao').value = dim; document.getElementById('org-tipo').value = tipo;
            document.getElementById('org-pais').value = pais; document.getElementById('org-desc').value = desc;
            document.getElementById('modal').classList.add('active');
        }

        document.getElementById('org-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { nome: document.getElementById('org-nome').value, setor: document.getElementById('org-setor').value, dimensao: document.getElementById('org-dimensao').value, tipo: document.getElementById('org-tipo').value, pais: document.getElementById('org-pais').value, descricao: document.getElementById('org-desc').value };
            try {
                if (editId) { await api.atualizarOrganizacao(editId, data); showToast('Organização atualizada!', 'success'); }
                else { await api.criarOrganizacao(data); showToast('Organização criada!', 'success'); }
                hideModal(); loadOrgs();
            } catch(err) { showToast(err.error || 'Erro', 'error'); }
        });

        async function deleteOrg(id) { if (confirm('Eliminar organização?')) { try { await api.eliminarOrganizacao(id); showToast('Eliminada', 'success'); loadOrgs(); } catch(e) { showToast(e.error, 'error'); } } }
        async function startAval(orgId) { try { const a = await api.criarAvaliacao(orgId); window.location.href = `/pages/questionario.html?id=${a.id}`; } catch(e) { showToast(e.error, 'error'); } }
        loadOrgs();
    </script>
</body></html>
