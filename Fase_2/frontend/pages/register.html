<!DOCTYPE html>
<html lang="pt"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar — AILO</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head><body>
    <nav class="navbar"><a href="/" class="navbar-brand"><div class="logo-hex"></div><span>AILO</span></a><div class="navbar-nav" id="nav-links"></div></nav>
    <div class="auth-container">
        <div class="auth-card animate-fade">
            <h1>Criar Conta</h1>
            <p class="subtitle">Comece a avaliar a sua organização</p>
            <form id="register-form">
                <div class="form-group"><label class="form-label">Nome Completo</label><input type="text" class="form-input" id="nome" required placeholder="O seu nome"></div>
                <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="email" required placeholder="seu@email.pt"></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="password" required placeholder="Mínimo 6 caracteres"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="reg-btn">Criar Conta</button>
            </form>
            <div class="auth-footer">Já tem conta? <a href="/pages/login.html">Entrar</a></div>
        </div>
    </div>
    <script src="/static/js/api.js"></script><script src="/static/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            btn.textContent = 'A criar...'; btn.disabled = true;
            try {
                const res = await api.register({ nome: document.getElementById('nome').value, email: document.getElementById('email').value, password: document.getElementById('password').value });
                api.setToken(res.token); api.setUser(res);
                showToast('Conta criada com sucesso!', 'success');
                setTimeout(() => window.location.href = '/pages/dashboard.html', 500);
            } catch (err) { showToast(err.error || 'Erro no registo', 'error'); btn.textContent = 'Criar Conta'; btn.disabled = false; }
        });
    </script>
</body></html>
